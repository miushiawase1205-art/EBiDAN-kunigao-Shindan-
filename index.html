:root {
  --gold: #b99a5b;

  --black: #222;
  --gray: #777;
  --ivory: #faf9f5;
  --white: #fff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at top, #fffdf8 0%, #fff 45%, #f8f7f3 100%);
  color: var(--black);
  font-family: "Noto Serif JP", serif;
  min-height: 100vh;
}

button {
  font-family: inherit;
}

.page {
  width: 100%;
  min-height: 100vh;
  padding: 25px 16px 60px;
}

.container {
  width: min(100%, 1050px);
  margin: auto;
}

.gold-line {
  width: 80px;
  height: 1px;
  background: var(--gold);
  margin: 18px auto;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

/* =========================
   TOP
========================= */

#startScreen {
  text-align: center;
  padding-top: 10vh;
}

.crown {
  color: var(--gold);
  font-size: 35px;
  letter-spacing: 8px;
}

.english-title {
  font-family: "Cormorant Garamond", serif;
  color: var(--gold);
  font-size: 18px;
  letter-spacing: 5px;
  margin-top: 12px;
}

.main-title {
  font-size: clamp(40px, 9vw, 75px);
  letter-spacing: 12px;
  font-weight: 500;
  margin: 10px 0 0;
}

.subtitle {
  font-family: "Cormorant Garamond", serif;
  color: #777;
  font-size: 18px;
  letter-spacing: 3px;
  margin-top: 5px;
}

.intro-box {
  max-width: 680px;
  margin: 45px auto;
  padding: 35px 25px;
  border: 1px solid var(--gold-light);
  background: rgba(255,255,255,.8);
  box-shadow: 0 12px 35px rgba(120,100,60,.08);
}

.intro-box p {
  line-height: 2;
  margin: 8px 0;
}

.start-button,
.restart-button {
  border: 1px solid var(--gold);
  background: white;
  color: #6d5627;
  padding: 16px 60px;
  font-size: 16px;
  letter-spacing: 4px;
  cursor: pointer;
  transition: .3s;
}

.start-button:hover,
.restart-button:hover {
  background: var(--gold);
  color: white;
}

/* =========================
   QUESTION
========================= */

.question-header {
  text-align: center;
  margin-bottom: 30px;
}

.small-title {
  font-family: "Cormorant Garamond", serif;
  color: var(--gold);
  letter-spacing: 4px;
  font-size: 17px;
}

.question-number {
  font-size: 15px;
  color: #777;
  margin-top: 8px;
}

.progress-wrap {
  width: min(500px, 90%);
  height: 3px;
  background: #eee;
  margin: 15px auto 35px;
}

.progress {
  height: 100%;
  width: 0%;
  background: var(--gold);
  transition: .4s;
}

.choice-title {
  text-align: center;
  font-size: 18px;
  margin-bottom: 25px;
  letter-spacing: 2px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 22px;
  max-width: 850px;
  margin: auto;
}

.member-card {
  background: white;
  border: 1px solid #e2d6b9;
  padding: 12px;
  cursor: pointer;
  position: relative;
  transition: .3s;
  box-shadow: 0 8px 25px rgba(80,60,30,.07);
}

.member-card::before,
.member-card::after {
  content: "";
  position: absolute;
  width: 25px;
  height: 25px;
  border-color: var(--gold);
  border-style: solid;
}

.member-card::before {
  top: 5px;
  left: 5px;
  border-width: 1px 0 0 1px;
}

.member-card::after {
  right: 5px;
  bottom: 5px;
  border-width: 0 1px 1px 0;
}

.member-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 35px rgba(80,60,30,.13);
}

.member-photo {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  background:
    linear-gradient(135deg, #faf9f5, #eee9dd);
  display: block;
}

.photo-placeholder {
  width: 100%;
  aspect-ratio: 3 / 4;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(135deg, #faf9f5, #eee9dd);
  color: var(--gold);
  font-family: "Cormorant Garamond", serif;
  font-size: 50px;
}

.member-name {
  text-align: center;
  font-size: 21px;
  margin: 15px 0 3px;
}

.member-group {
  text-align: center;
  color: #888;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.tap-text {
  text-align: center;
  color: var(--gold);
  font-size: 11px;
  letter-spacing: 2px;
}

/* =========================
   RESULT
========================= */

#resultScreen {
  text-align: center;
}

.result-heading {
  font-family: "Cormorant Garamond", serif;
  color: var(--gold);
  font-size: 20px;
  letter-spacing: 5px;
}

.result-title {
  font-size: clamp(32px, 8vw, 60px);
  font-weight: 500;

}

.result-description {

.result-card {

.type-icon {

}

.type-name {

  margin: 12px 0;
}

.result-percent {

  color: var(--gold);
  font-size: 30px;
}

.breakdown {

  margin: 40px auto;
  text-align: left;
}

.breakdown-title {
  text-align: center;
  color: var(--gold);
  letter-spacing: 3px;
  margin-bottom: 20px;
}

.type-row {
  display: grid;
  grid-template-columns: 110px 1fr 55px;
  gap: 10px;
  align-items: center;
  margin: 12px 0;
  font-size: 13px;
}

.bar {
  height: 7px;
  background: #eee;
}

.bar-inner {
  height: 100%;
  background: var(--gold);
}

.footer {
  text-align: center;
  margin-top: 60px;
  color: #999;
  font-size: 11px;
  letter-spacing: 2px;
}

@media (max-width: 600px) {
  .cards {

  .main-title {

}
</style>

/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

  const arr = [...array];

  for (let i = arr.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [arr[i], arr[j]] = [arr[j], arr[i]];

  }

  return arr;
}


/* =========================================================
   CREATE QUESTIONS
========================================================= */

function createQuestions() {

  const shuffled = shuffle(members);

  questions = [];

  let index = 0;

  for (let i = 0; i < QUESTION_COUNT; i++) {

    let a = shuffled[index % shuffled.length];
    let b = shuffled[(index + 1) % shuffled.length];

    index += 2;

    if (a.name === b.name) {
      b = shuffled[(index + 1) % shuffled.length];
      index++;
    }

    questions.push([a, b]);

  }

}


/* =========================================================
   START
========================================================= */

function startDiagnosis() {

  scores = {
    "建国顔": 0,
    "継承顔": 0,
    "護国顔": 0,
    "敵国顔": 0,
    "救国顔": 0,
    "傾国顔": 0,
    "亡国顔": 0
  };

  currentQuestion = 0;

  createQuestions();

  showScreen("questionScreen");

  showQuestion();

}


/* =========================================================
   SHOW QUESTION
========================================================= */

function showQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("questionNumber").textContent =
    `QUESTION ${currentQuestion + 1} / ${QUESTION_COUNT}`;

  document.getElementById("progress").style.width =
    `${((currentQuestion) / QUESTION_COUNT) * 100}%`;

  const cards = document.getElementById("cards");

  cards.innerHTML = "";

  q.forEach(member => {

    const card = document.createElement("div");

    card.className = "member-card";

    let photoHTML;

    if (member.photo && member.photo.trim() !== "") {

      photoHTML = `
        <img
          class="member-photo"
          src="${member.photo}"
          alt="${member.name}"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
        >
        <div class="photo-placeholder" style="display:none;">
          ${member.name.charAt(0)}
        </div>
      `;

    } else {

      photoHTML = `
        <div class="photo-placeholder">
          ${member.name.charAt(0)}
        </div>
      `;

    }

    card.innerHTML = `
      ${photoHTML}

      <div class="member-name">
        ${member.name}
      </div>

      <div class="member-group">
        ${member.group}
      </div>

      <div class="tap-text">
        SELECT
      </div>
    `;

    card.addEventListener("click", () => {
      selectMember(member);
    });

    cards.appendChild(card);

  });

}


/* =========================================================
   SELECT
========================================================= */

function selectMember(member) {

  scores[member.type]++;

  currentQuestion++;

  if (currentQuestion >= QUESTION_COUNT) {

    showResult();

  } else {

    showQuestion();

  }

}


/* =========================================================
   RESULT
========================================================= */

function showResult() {

  showScreen("resultScreen");

  document.getElementById("progress").style.width = "100%";

  const sorted = Object.entries(scores)
    .sort((a, b) => b[1] - a[1]);

  const winnerType = sorted[0][0];

  const total = QUESTION_COUNT;

  const winnerPercent =
    Math.round((scores[winnerType] / total) * 100);

  document.getElementById("resultIcon").textContent =
    faceTypes[winnerType].icon;

  document.getElementById("resultType").textContent =
    winnerType;

  document.getElementById("resultPercent").textContent =
    `${winnerPercent}%`;

  document.getElementById("resultDescription").textContent =
    faceTypes[winnerType].description;

  const breakdown = document.getElementById("breakdown");

  breakdown.innerHTML = "";

  sorted.forEach(([type, score]) => {

    const percent =
      Math.round((score / total) * 100);

    const row = document.createElement("div");

    row.className = "type-row";

    row.innerHTML = `
      <div>
        ${faceTypes[type].icon} ${type}
      </div>

      <div class="bar">
        <div
          class="bar-inner"
          style="width:${percent}%"
        ></div>
      </div>

      <div>
        ${percent}%
      </div>
    `;

    breakdown.appendChild(row);

  });

}


/* =========================================================
   RESTART
========================================================= */

function restartDiagnosis() {

  showScreen("startScreen");

}


/* =========================================================
   SCREEN
========================================================= */

function showScreen(id) {

  document.querySelectorAll(".screen").forEach(screen => {
    screen.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

</script>
